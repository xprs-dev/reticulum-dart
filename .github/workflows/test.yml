name: test

# Runs the reticulum-dart unit tests on every push/PR. The file-transfer suite
# (test/file_transfer_test.dart) is the regression lock for binary transfer over
# Reticulum — it exercises the segmented-manifest large-file path (1/10/55 MB
# round-trips), corrupted-chunk rejection, and multi-source work-stealing + the
# resume-on-drop path entirely in-process, so a regression fails CI instead of
# being found by hand on devices.
#
# The stores are zx stores: zx (x1watt/zx) is a path dependency at
# ../../x1watt/zx, cloned there by each job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch zx (path dependency)
        run: |
          mkdir -p ../../x1watt
          git clone -q --depth 1 https://github.com/x1watt/zx.git ../../x1watt/zx

      # The package is plain Dart: no Flutter needed to test it.
      - uses: dart-lang/setup-dart@v1

      - run: dart pub get
      - run: dart analyze
      - run: dart test

  # The BLE half needs Flutter's platform plugins, so it is analyzed with Flutter.
  ble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch zx (path dependency)
        run: |
          mkdir -p ../../x1watt
          git clone -q --depth 1 https://github.com/x1watt/zx.git ../../x1watt/zx

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze reticulum_ble
        working-directory: packages/reticulum_ble
        run: |
          flutter pub get
          flutter analyze
