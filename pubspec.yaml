name: reticulum
description: >-
  The shared XPRS network + user protocol stack: a pure-Dart Reticulum core
  (transport, links, resources), NOSTR identity & notes, LXMF messaging, a
  distributed social relay, a DHT, content-addressed file sharing, the XPRS
  signature scheme, and BLE transport primitives. Plain Dart; the Flutter BLE
  plugins live in packages/reticulum_ble.
version: 0.2.0
repository: https://github.com/xprs-dev/reticulum-dart
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  crypto: ^3.0.3            # SHA-256 / SHA-1
  pointycastle: ^3.9.1      # secp256k1 / BIP-340 + XPRS short-Schnorr
  cryptography: ^2.7.0      # X25519 / Ed25519 / AEAD (RNS link + folders)
  bech32: ^0.2.2            # npub / nsec encoding
  hex: ^0.2.0               # hex <-> bytes
  zx:                       # zxdb: the stores' database (x1watt/zx beside xprs)
    path: ../../x1watt/zx
  file: ^7.0.0              # injectable filesystem (lib/src/util/file_system.dart): disk natively, the host's tree on web
  web_socket_channel: ^2.4.0 # wss:// NOSTR relays (native + web)
  archive: ^3.6.1           # BLE parcel (de)compression

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
